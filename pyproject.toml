[project]
name = "modelblocks-directory-ingest"
version = "0.1.0"
description = "Ingest for the Modelblocks module directory"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "markdown-it-py>=3.0",
  "nh3>=0.2.17",
  "pydantic>=2.6",
  "pygments>=2.17",
  "requests>=2.31",
]

[tool.setuptools]
packages = ["ingest"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.dependencies]
python = ">=3.11"
hugo = ">=0.126"
gh = ">=2.95.0"

[tool.pixi.pypi-dependencies]
modelblocks-directory-ingest = { path = ".", editable = true }
pagefind = { version = ">=1.5", extras = ["bin"] }  # Not on conda-forge

[tool.pixi.tasks]
ingest = "python -m ingest"
serve = { cmd = "hugo server -D", depends-on = ["ingest"] }
build = { cmd = "hugo --minify && python -m pagefind_bin --site public", depends-on = ["ingest"] }
clean = "rm -rf public resources data/modules.json static/css/highlight.css"
