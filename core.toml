##
# Core modules
# Strict validation: invalid module = build failure
#
# Each entry is minimally the module's repo URL.
# For a non-default branch or a module in a subdir,
# use an inline table instead of a bare string:
#   { repo = "https://github.com/org/module_foo", ref = "dev", subdir = "pkg" }
##

modules = [
  "https://github.com/modelblocks-org/module_geo_boundaries",
  "https://github.com/modelblocks-org/module_powerplants",
  # No v1.0-format release yet; track main and flag as work-in-progress until one exists
  { repo = "https://github.com/modelblocks-org/module_area_potentials", ref = "main", work_in_progress = true },
  "https://github.com/modelblocks-org/module_hydropower",
]

##
# Core tool repositories
#
# These are not shown in the module directory grid, but their
# contributors count toward the project-wide contributors page.
# Same entry format as `modules` (URL string or inline table).
##

tools = [
  "https://github.com/modelblocks-org/gregor",
  "https://github.com/modelblocks-org/data-module-template",
  "https://github.com/modelblocks-org/docs",
  "https://github.com/modelblocks-org/website",
]
