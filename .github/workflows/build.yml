name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *" # nightly: pull in upstream module changes (03:00 UTC)
  workflow_dispatch: {} # manual "Run workflow" button

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: # never let two deploys race
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to immutable commit SHAs (supply-chain
      # hardening); the trailing comment tracks the human-readable version.
      # Dependabot (.github/dependabot.yml) bumps the SHA + comment via PR.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          locked: true # honor committed pixi.lock
      - run: pixi run build # ingest -> hugo --minify -> pagefind index -> ./public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # ingest/fetch.py reads this
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
